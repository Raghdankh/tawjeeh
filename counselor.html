<!doctype html><html lang="ar" dir="rtl"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>مسار · سجل الحالات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<script src="config.js"></script>
<script src="masar.js"></script>
<script src="ai.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js"></script>
<style>
/* Layout: one column record book. Tabs: home, cases, reports centre, plan. Sheets slide over. Reports render as A4 paper pages in the school's official style. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --sunk:#E8EDEB; --ink:#18211F; --muted:#5A6865; --line:#D8E0DD;
  --brand:#1F5E58; --brand-ink:#FFFFFF; --focus:#2F6BD1;
  --good:#2E7D4F; --warn:#B26A00; --bad:#B3363B;
  --c-separation:#C2416B; --c-orphan:#7350C0; --c-economic:#A86B12; --c-health:#1C8580;
  --c-delayed:#C9532A; --c-excellent:#2E66C9; --c-gifted:#3E8A3A; --c-psych:#5B4FD1; --c-behavior:#B8456B;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111615; --surface:#19201F; --sunk:#141A19; --ink:#E6EDEB; --muted:#9AA9A5; --line:#2A3432;
  --brand:#8FCBBF; --brand-ink:#0F1C1A; --focus:#7FA8F0;
  --good:#6CC28E; --warn:#E3A84A; --bad:#EE7C80;
  --c-separation:#EE7FA2; --c-orphan:#A78BF0; --c-economic:#E0AE55; --c-health:#5CC7BF;
  --c-delayed:#F08E66; --c-excellent:#7EA6F2; --c-gifted:#7FC57A; --c-psych:#A79CF5; --c-behavior:#F08CAD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111615; --surface:#19201F; --sunk:#141A19; --ink:#E6EDEB; --muted:#9AA9A5; --line:#2A3432;
  --brand:#8FCBBF; --brand-ink:#0F1C1A; --focus:#7FA8F0;
  --good:#6CC28E; --warn:#E3A84A; --bad:#EE7C80;
  --c-separation:#EE7FA2; --c-orphan:#A78BF0; --c-economic:#E0AE55; --c-health:#5CC7BF;
  --c-delayed:#F08E66; --c-excellent:#7EA6F2; --c-gifted:#7FC57A; --c-psych:#A79CF5; --c-behavior:#F08CAD; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.app{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 104px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.4rem;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 8px;display:grid;gap:10px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0}
.seal{width:38px;height:38px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.1rem;flex:none}
.mode{font-size:.78rem;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.mode.ok{color:var(--good)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:7px;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}

.section{display:grid;gap:12px;margin-top:22px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.55;cursor:progress}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 6px 18px rgb(0 0 0/.18);padding:12px 22px;border-radius:99px;font-size:1rem}
.empty{text-align:center;padding:28px 16px;display:grid;gap:10px;justify-items:center}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:.85rem}

.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cat{--c:var(--muted);text-align:start;border:1px solid color-mix(in srgb,var(--c) 32%,var(--line));background:color-mix(in srgb,var(--c) 9%,var(--surface));border-radius:var(--r);padding:12px;display:grid;gap:4px;min-width:0}
.cat .n{font-family:var(--f-display);font-size:1.9rem;font-weight:700;color:var(--c);line-height:1.1}
.cat .t{font-weight:600}
.cat .s{font-size:.8rem;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.chip{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:.8rem;background:color-mix(in srgb,var(--c) 13%,var(--surface));color:color-mix(in srgb,var(--c) 75%,var(--ink));border:1px solid color-mix(in srgb,var(--c) 28%,transparent);white-space:nowrap}
.k-separation{--c:var(--c-separation)} .k-orphan{--c:var(--c-orphan)} .k-economic{--c:var(--c-economic)} .k-health{--c:var(--c-health)} .k-delayed{--c:var(--c-delayed)} .k-excellent{--c:var(--c-excellent)} .k-gifted{--c:var(--c-gifted)}.k-psych{--c:var(--c-psych)} .k-behavior{--c:var(--c-behavior)} .k-all{--c:var(--brand)}

.st{font-size:.78rem;padding:2px 9px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
.st-new{color:var(--focus)} .st-active{color:var(--warn)} .st-improved{color:var(--good)} .st-closed{color:var(--muted);background:var(--sunk)}

.list{display:grid;gap:8px}
.case{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:start;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.av{--c:var(--muted);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);flex:none}
.case .body{min-width:0;display:grid;gap:4px}
.case .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.case .meta{display:flex;gap:6px;flex-wrap:wrap}
.case .side{display:grid;gap:4px;justify-items:end;font-size:.78rem;color:var(--muted)}
.late{color:var(--bad)}
.filters{display:grid;gap:8px}
.filters input,.filters select{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);width:100%}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chiprow button{flex:none}
.chiprow .chip,.pickcats .chip{cursor:pointer;padding:5px 12px;font-size:.85rem}
.chiprow .chip[aria-pressed="true"],.pickcats .chip[aria-pressed="true"]{background:var(--c);color:var(--surface);border-color:var(--c)}
.pickcats{display:flex;flex-wrap:wrap;gap:6px}

.cathero{--c:var(--muted);border-radius:var(--r);padding:16px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));display:grid;gap:10px}
.cathero h2{color:color-mix(in srgb,var(--c) 80%,var(--ink))}
.ideas{display:flex;flex-wrap:wrap;gap:6px}
.ideas span{font-size:.82rem;padding:3px 10px;border-radius:7px;background:var(--surface);border:1px solid var(--line)}

/* sheets */
.overlay{position:fixed;inset:0;z-index:20;background:rgb(10 16 15/.45);display:flex;justify-content:center;align-items:flex-end}
.overlay.top2{z-index:30}
@media (min-width:720px){.overlay{align-items:center;padding:24px}}
.sheet{--c:var(--brand);background:var(--bg);width:100%;max-width:720px;max-height:94vh;overflow-y:auto;border-radius:16px 16px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet.wide{max-width:900px}
@media (min-width:720px){.sheet{border-radius:16px;max-height:92vh}}
.sheethead{position:sticky;top:0;z-index:2;padding:14px 16px;background:color-mix(in srgb,var(--c) 14%,var(--bg));border-bottom:1px solid color-mix(in srgb,var(--c) 30%,var(--line));display:grid;gap:8px}
.x{border:0;background:transparent;font-size:1.5rem;line-height:1;padding:4px 8px;color:var(--muted)}
.sheetbody{padding:16px;display:grid;gap:14px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:8px;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.plan{display:grid;gap:6px}
.plan label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
.plan input{margin-top:5px;accent-color:var(--c);width:17px;height:17px;flex:none}
.plan .done span{text-decoration:line-through;color:var(--muted)}
.rm{margin-inline-start:auto;border:0;background:transparent;color:var(--muted);font-size:1.1rem;padding:0 4px}
.timeline{display:grid;border-inline-start:2px solid var(--line);margin-inline-start:6px}
.ev{position:relative;padding-block:4px 16px;padding-inline:18px 0}
.ev::before{content:"";position:absolute;inset-inline-start:-7px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--c,var(--brand))}
.ev .h{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem}
.ev p{margin-top:4px;white-space:pre-wrap}
.pg-up{color:var(--good)} .pg-same{color:var(--muted)} .pg-down{color:var(--bad)}

.form{display:grid;gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field>span,.field>label{font-size:.85rem;font-weight:500;color:var(--muted)}
.optbox{margin-top:2px}
.optbox>summary{cursor:pointer;font-size:.82rem;color:var(--brand);font-weight:600;padding:4px 0;list-style-position:inside}
.opts{display:grid;gap:5px;margin-top:4px;max-height:300px;overflow-y:auto;padding:2px}
.opt{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px 7px 10px;font-size:.88rem;line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.opt::before{content:"";flex:none;width:16px;height:16px;margin-top:3px;border-radius:5px;border:1.5px solid var(--line);background:var(--surface)}
.opts[data-mode="one"] .opt::before{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--c,var(--brand));background:color-mix(in srgb,var(--c,var(--brand)) 10%,var(--surface))}
.opt[aria-pressed="true"]::before{background:var(--c,var(--brand));border-color:var(--c,var(--brand));box-shadow:inset 0 0 0 3px var(--surface)}
.autofill{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--c,var(--brand)) 9%,var(--surface));border:1px dashed color-mix(in srgb,var(--c,var(--brand)) 40%,var(--line))}
.field input,.field select,.field textarea,.inp{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);width:100%;min-width:0}
.field textarea{min-height:76px;resize:vertical}
.hint{font-size:.78rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.sugg{display:grid;gap:5px;max-height:340px;overflow-y:auto;padding:2px}
.sugg label{display:flex;gap:10px;align-items:flex-start;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;font-size:.9rem;line-height:1.5;cursor:pointer;color:var(--ink);font-weight:400}
.sugg label:has(input:checked){border-color:var(--c,var(--brand));background:color-mix(in srgb,var(--c,var(--brand)) 10%,var(--surface))}
.field .sugg input[type="checkbox"],.sugg input[type="checkbox"]{width:17px;height:17px;min-width:17px;padding:0;margin:3px 0 0;flex:none;accent-color:var(--c,var(--brand))}
.sugg label span{flex:1;min-width:0}

/* evidence */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.thumb{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk);display:grid}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;max-width:100%}
.thumb input{border:0;border-top:1px solid var(--line);border-radius:0;padding:6px 8px;font-size:.8rem;background:var(--surface);width:100%}
.thumb .del{position:absolute;top:4px;inset-inline-end:4px;background:rgb(0 0 0/.55);color:#fff;border:0;border-radius:99px;width:26px;height:26px;line-height:1}
.addph{border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;aspect-ratio:4/3;color:var(--muted);font-size:.85rem;cursor:pointer;background:var(--surface);text-align:center;padding:8px}
.minithumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.minithumbs img{width:56px;height:42px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}

/* reports centre */
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tpl{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:4px}
.tpl b{font-weight:600}
.tpl:hover{border-color:var(--brand)}
.rep{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.rep .ic{width:40px;height:48px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);position:relative;overflow:hidden}
.rep .ic::before{content:"";position:absolute;inset:0 0 auto 0;height:7px;background:var(--brand)}
.rep .ic::after{content:"";position:absolute;inset:16px 8px auto 8px;height:14px;background:repeating-linear-gradient(var(--line) 0 2px,transparent 2px 6px)}
.rep .body{min-width:0;display:grid;gap:3px}
.rep .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.secedit{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.secedit .row{flex-wrap:nowrap}
.secedit .row .inp{flex:1}
.inforow{display:grid;grid-template-columns:minmax(90px,1fr) 2fr auto;gap:6px;align-items:center}

/* plan tab */
.phases{display:grid;gap:8px}
.phase{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.phase .wk{font-family:var(--f-display);font-weight:600;font-size:.85rem;padding:4px 10px;border-radius:8px;background:var(--sunk);white-space:nowrap}
.phase.now{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.phase.now .wk{background:var(--brand);color:var(--brand-ink)}
.phase.past{opacity:.7}
.plancat{--c:var(--muted);border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-radius:var(--r);background:var(--surface);overflow:hidden}
.plancat>summary{list-style:none;cursor:pointer;padding:14px;display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.plancat>summary::-webkit-details-marker{display:none}
.plancat>summary h3{color:color-mix(in srgb,var(--c) 80%,var(--ink));flex:1}
.plancat .in{padding:14px;display:grid;gap:12px}
.ivt{width:100%;border-collapse:collapse;font-size:.88rem}
.ivt th,.ivt td{text-align:start;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.ivt th{color:var(--muted);font-weight:500;font-size:.8rem}
@media (max-width:520px){.ivt td:first-child,.ivt th:first-child{display:none}}
.meter{display:inline-block;width:46px;height:6px;border-radius:9px;background:var(--sunk);vertical-align:middle;overflow:hidden;margin-inline-end:6px}
.meter i{display:block;height:100%;background:var(--c)}
.idea{border-radius:10px;padding:12px;background:color-mix(in srgb,var(--c) 8%,var(--surface));border:1px dashed color-mix(in srgb,var(--c) 45%,var(--line));display:grid;gap:6px}
.tablewrap{overflow-x:auto}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.checks label:last-child{border-bottom:0}
.checks input{margin-top:5px;width:17px;height:17px;accent-color:var(--brand);flex:none}

/* stats */
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid}
.metric b{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.2}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(110px,150px) 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:12px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--c);border-radius:99px}
@media (max-width:520px){.bar{grid-template-columns:1fr auto}.bar .track{grid-column:1/-1;order:3}}

.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:16px;right:16px;margin:auto;max-width:420px;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;z-index:60;text-align:center}
.note{font-size:.82rem;color:var(--muted);background:var(--sunk);border-radius:9px;padding:10px 12px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

/* ---------- A4 paper (always light: it is paper) ---------- */
.preview{display:grid;gap:16px;justify-items:center;padding:16px;background:var(--sunk)}
.pgbox{position:relative;overflow:hidden;box-shadow:0 2px 10px rgb(0 0 0/.18);background:#fff;max-width:100%}
.pg{width:794px;height:1123px;background:#fff;color:#22302E;position:relative;font-family:"Tajawal","Segoe UI",Tahoma,"Geeza Pro","Noto Sans Arabic",sans-serif;direction:rtl;text-align:right;transform-origin:top right;position:absolute;top:0;right:0;line-height:1.5}
.pg *{box-sizing:border-box}
.pg-bar{height:14px;background:#1F5E58}
.pg-in{padding:30px 56px 0}
.pg-foot{position:absolute;bottom:22px;left:56px;right:56px;font-size:11px;color:#8A9896;display:flex;justify-content:space-between}
.measure{position:fixed;top:0;left:-20000px;visibility:hidden;pointer-events:none}
.b{padding-bottom:12px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:20px}
.hd-t{font-size:13px;line-height:1.85;color:#3B4A48}

function secBank(h,cats){

  if(/وصف/.test(h)) return pick('desc');

function refCount(pid){let n=0;S.docs.forEach(d=>{if(photoIdsOf(d).includes(pid))n++});return n}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};i.src=u})}
async function compress(file,{max=1400,limit=230000,png=false}={}){
  const im=await loadImg(file); let m=max;
  for(let round=0;round<5;round++){
    const s=Math.min(1,m/Math.max(im.naturalWidth,im.naturalHeight)); const w=Math.round(im.naturalWidth*s),h=Math.round(im.naturalHeight*s);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');
    if(png){cx.drawImage(im,0,0,w,h);const d=cv.toDataURL('image/png');if(d.length<limit)return d}
    cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(im,0,0,w,h);
    for(const ql of [.82,.72,.62,.52]){const d=cv.toDataURL('image/jpeg',ql);if(d.length<limit)return d}
    m=Math.round(m*.75);
  }
  throw new Error('big');
}

function periodStart(){const d=new Date();if(PERIOD==='month')d.setDate(1);else if(PERIOD==='term')d.setMonth(d.getMonth()-4);else return '0000';return isoOf(d)}
const PNAME={month:'هذا الشهر',term:'آخر ٤ أشهر',all:'كل الفترات'};
function stats(){
  const from=periodStart();const cs=cases();
  const inP=cs.filter(c=>(c.date||'')>=from||(c.follow||[]).some(f=>f.date>=from));
  const fol=inP.flatMap(c=>(c.follow||[]).filter(f=>f.date>=from).map(f=>({...f,c})));
  const cnt=t=>fol.filter(f=>f.type===t).length;
  const rs=reports().filter(r=>(r.date||'')>=from);
  const byCat=CATS.map(k=>({k:k.k,t:k.t,n:inP.filter(c=>(c.cats||[]).includes(k.k)).length,f:fol.filter(f=>(f.c.cats||[]).includes(k.k)).length,r:rs.filter(r=>(r.cats||[]).includes(k.k)).length}));
  const bySt=STATUS.map(s=>({t:s.t,n:inP.filter(c=>c.status===s.k).length}));
  const pl=inP.reduce((a,c)=>{const p=planDone(c);a.d+=p.d;a.t+=p.t;return a},{d:0,t:0});
  const improved=inP.filter(c=>c.status==='improved'||c.status==='closed'||trend(c)==='up').length;
  const byTpl=Object.entries(TPL).map(([k,t])=>({t:t.n,n:rs.filter(r=>r.tpl===k).length})).filter(x=>x.n);
  const photos=rs.reduce((a,r)=>a+(r.photos||[]).length,0)+fol.reduce((a,f)=>a+(f.photos||[]).length,0);
  return {inP,fol,rs,byCat,bySt,pl,improved,byTpl,photos,ben:rs.reduce((a,r)=>a+benef(r),0),
    m:{cases:inP.length,open:inP.filter(isOpen).length,fol:fol.length,ind:cnt('جلسة فردية'),grp:cnt('جلسة جماعية'),fam:cnt('لقاء ولي أمر')+cnt('اتصال بولي الأمر'),ref:cnt('تحويل لجهة'),tch:cnt('متابعة مع معلمة'),late:inP.filter(needsFollow).length}};
}
function statsPanel(){
  const s=stats();const maxC=Math.max(1,...s.byCat.map(x=>x.n+x.r));const rate=s.m.cases?Math.round(s.improved/s.m.cases*100):0;
  return `<div class="metrics">
    <div class="metric"><span class="small muted">الحالات</span><b class="num">${N(s.m.cases)}</b><span class="small muted">${N(s.m.open)} مفتوحة</span></div>
    <div class="metric"><span class="small muted">المتابعات</span><b class="num">${N(s.m.fol)}</b><span class="small muted">${N(s.m.ind)} جلسة فردية</span></div>

    <div class="metric"><span class="small muted">نسبة التحسن</span><b class="num" style="color:var(--good)">${N(rate)}٪</b><span class="small muted">${N(s.improved)} من ${N(s.m.cases)}</span></div>
    <div class="metric"><span class="small muted">الشواهد</span><b class="num">${N(s.photos)}</b><span class="small muted">صورة موثقة</span></div></div>
   <div class="panel"><h3 style="margin-bottom:12px">حسب الفئة · ${PNAME[PERIOD]}</h3><div class="bars">${s.byCat.map(c=>`<div class="bar k-${c.k}"><span class="row" style="gap:6px;flex-wrap:nowrap"><i class="dot"></i>${esc(c.t)}</span><span class="track"><span class="fill" style="width:${(c.n+c.r)/maxC*100}%"></span></span><span class="num small">${N(c.n)} حالة · ${N(c.r)} برنامج</span></div>`).join('')}</div></div>`;
}

const PAGE_H=1123, BODY_H=1123-14-30-70;
function paperHeader(st){
  return `<div class="b hd"><div class="hd-t"><div>المملكة العربية السعودية</div><div>وزارة التعليم</div>${st.region?`<div>${esc(st.region)}</div>`:''}${st.office?`<div>${esc(st.office)}</div>`:''}${st.school?`<div class="sch">${esc(st.school)}</div>`:''}</div>${st.logo?`<img class="logo" src="${st.logo}" alt="">`:''}</div>`;
}
function bodyBlocks(m,imgs){
  const B=[];
  B.push({h:`<div class="b tt"><h1>${esc(m.title)}</h1>${m.subtitle?`<p>${esc(m.subtitle)}</p>`:''}<hr></div>`});
  const pairs=[];for(let i=0;i<m.info.length;i+=2)pairs.push(m.info.slice(i,i+2));
  if(m.lead||pairs.length) B.push({h:`<div class="b inf">${m.lead?`<div class="lead">${esc(m.lead.l)}: ${esc(m.lead.v)}</div>`:''}${pairs.map(p=>`<div class="pr">${p.map(x=>`<span>${esc(x.l)}: ${esc(x.v)}</span>`).join('')}</div>`).join('')}</div>`});
  m.sections.forEach(s=>{
    B.push({h:`<div class="b sh"><div>${esc(s.h)} :</div></div>`,keep:true});
    if(s.rows){
      const head=s.rows[0],body=s.rows.slice(1);
      for(let i=0;i<body.length;i+=12){const part=body.slice(i,i+12);B.push({h:`<div class="b stbl"><table><thead><tr>${head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${part.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`})}
    } else {
      const L=lines(s.t);
      if(L.length>1) L.forEach((l,i)=>B.push({h:`<div class="b sl${i===L.length-1?' last':''}"><p>• ${esc(l)}</p></div>`}));
      else { const words=String(L[0]||'').split(/\s+/); for(let i=0;i<words.length;i+=90) B.push({h:`<div class="b sp"><p>${esc(words.slice(i,i+90).join(' '))}</p></div>`}) }
    }
  });
  const ph=(m.photos||[]).filter(p=>imgs[p.id]);
  if(ph.length){
    B.push({h:`<div class="b sh"><div>الشواهد :</div></div>`,keep:true});
    const per=m.onePage?3:2; for(let i=0;i<ph.length;i+=per) B.push({h:`<div class="b ph">${ph.slice(i,i+per).map(p=>`<figure><img src="${imgs[p.id]}" alt="">${p.cap?`<figcaption>${esc(p.cap)}</figcaption>`:''}</figure>`).join('')}</div>`});
  }
  return B;
}
function signBlock(st){return `<div class="b sg"><div><b>الموجهة الطلابية: ${esc(st.counselor||'')}</b><br><span class="ln">التوقيع: ................................</span></div><div><b>مديرة المدرسة: ${esc(st.principal||'')}</b><br><span class="ln">التوقيع: ................................</span></div></div>`}
async function paginate(m){
  const st=settings(); const imgs={};
  for(const p of (m.photos||[])){const d=await getImage(p.id); if(d) imgs[p.id]=d}
  const first=paperHeader(st), cont=`<div class="b ch">${esc(st.school||'')}${st.school?' · ':''}${esc(m.title)}</div>`;
  const blocks=bodyBlocks(m,imgs); blocks.push({h:signBlock(st)});
  if(m.onePage){
    const meas=$('#measure'); meas.innerHTML=`<div class="pg compact" style="position:relative;height:auto"><div class="pg-in"><div class="fit">${first}${blocks.map(b=>b.h).join('')}</div></div></div>`;
    const imgsEl=[...meas.querySelectorAll('img')]; await Promise.all(imgsEl.map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));
    const h=meas.querySelector('.fit').offsetHeight; meas.innerHTML='';
    const avail=1123-14-22-62; const sc=Math.min(1,avail/h);
    return [`<div class="pg compact"><div class="pg-bar"></div><div class="pg-in" style="overflow:hidden;height:${avail}px"><div class="fit" style="width:${100/sc}%;transform:scale(${sc});transform-origin:top right">${first}${blocks.map(b=>b.h).join('')}</div></div><div class="pg-foot"><span>${esc(st.school||'')}</span><span></span></div></div>`];
  }
  const meas=$('#measure'); meas.innerHTML=`<div class="pg" style="position:relative"><div class="pg-in">${[first,cont,...blocks.map(b=>b.h)].join('')}</div></div>`;
  if(st.logo){const lg=meas.querySelector('.logo'); if(lg&&!lg.complete) await new Promise(r=>{lg.onload=lg.onerror=r})}
  const kids=[...meas.querySelector('.pg-in').children]; const hFirst=kids[0].offsetHeight, hCont=kids[1].offsetHeight;
  blocks.forEach((b,i)=>{b.ht=kids[i+2].offsetHeight});
  meas.innerHTML='';
  const pages=[[first]]; let used=hFirst, n=0;
  blocks.forEach((b,i)=>{
    let need=b.ht; if(b.keep&&blocks[i+1]) need+=blocks[i+1].ht;
    if(used+need>BODY_H && pages[pages.length-1].length>1){ pages.push([cont]); used=hCont }
    pages[pages.length-1].push(b.h); used+=b.ht;
  });
  return pages.map((p,i)=>`<div class="pg"><div class="pg-bar"></div><div class="pg-in">${p.join('')}</div><div class="pg-foot"><span>${esc(st.school||'')}</span><span>صفحة ${N(i+1)} من ${N(pages.length)}</span></div></div>`);
}

function fitPages(){const pv=$('#pv');if(!pv)return;const w=Math.min(794,pv.clientWidth-32);const s=w/794;pv.querySelectorAll('.pgbox').forEach(b=>{b.style.width=w+'px';b.style.height=(PAGE_H*s)+'px';b.querySelector('.pg').style.transform=`scale(${s})`})}

async function exportPDF(){
  const btn=$('#pdfbtn'); const pages=[...document.querySelectorAll('#pv .pg')]; if(!pages.length) return;
  if(!(window.PDFLib&&window.htmlToImage)){toast('أداة PDF لم تُحمَّل، استخدمي «ملف للطباعة»');return}
  btn.disabled=true; btn.textContent='جارٍ التجهيز…';
  try{
    const pdf=await PDFLib.PDFDocument.create(); pdf.setTitle(S.report.m.title);
    const opt={quality:.9,pixelRatio:2,width:794,height:1123,backgroundColor:'#ffffff',skipFonts:true,style:{transform:'none'}};
    try{await htmlToImage.toJpeg(pages[0],opt)}catch(e){}
    for(let i=0;i<pages.length;i++){
      btn.textContent='صفحة '+N(i+1)+' من '+N(pages.length)+'…';
      const url=await htmlToImage.toJpeg(pages[i],opt);
      const bin=atob(url.split(',')[1]); const bytes=new Uint8Array(bin.length); for(let j=0;j<bin.length;j++)bytes[j]=bin.charCodeAt(j);
      const img=await pdf.embedJpg(bytes); const pg=pdf.addPage([595.28,841.89]); pg.drawImage(img,{x:0,y:0,width:595.28,height:841.89});
    }
    const out=await pdf.save();
    await saveFile(fname(S.report.fileBase)+'.pdf',new Blob([out],{type:'application/pdf'}));
  }catch(e){ console.error(e); toast('تعذّر إنشاء PDF، جرّبي «ملف للطباعة»') }
  btn.disabled=false; btn.textContent='تنزيل PDF';
}

async function initStore() {
  setMode('loading');
  try { if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { if (d) S.downloads = d; }).catch(() => {}); } catch (e) {}
  try {
    const rows = await sbq(M.sb.from('masar_docs').select('id,data'));
    S.docs = new Map(rows.map(r => [r.id, r.data]));
    const sb = M.sb;
    S.col = { doc: id => ({
      set: body => sbq(sb.from('masar_docs').upsert({ id, data: body, updated_at: new Date().toISOString() })),
      delete: () => sbq(sb.from('masar_docs').delete().eq('id', id)) }) };
    S.media = { doc: id => ({
      set: v => sbq(sb.from('masar_images').upsert({ id, d: v.d })),
      get: async () => { const r = await sbq(sb.from('masar_images').select('d').eq('id', id).maybeSingle()); return { exists: !!r, data: () => r }; },
      delete: () => sbq(sb.from('masar_images').delete().eq('id', id)) }) };
    setMode('cloud'); $('#mode').textContent = 'محفوظ · لك وحدك';
  } catch (e) { toast('تعذّر تحميل السجل: ' + errT(e)); S.col = null; S.media = null; setMode('local'); loadLocal(); }
  renderMain();
  await loadRefs();
}
async function saveFile(name, data) {
  if (S.downloads) { try { await S.downloads.save({ filename: name, data }); toast('تم التنزيل'); return true; } catch (e) { if (e && e.code === 'declined') return false; } }
  try {
    const u = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type: 'application/octet-stream' }));
    const a = document.createElement('a'); a.href = u; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 5000); toast('تم التنزيل'); return true;
  } catch (e) { toast('تعذّر التنزيل في هذا المتصفح'); return false; }
}

function mbZoom(bg) { const w = bg.querySelector('.rep-pages'); if (w) w.style.zoom = Math.min(1, (bg.clientWidth - 16) / (210 * MB_MM)); }
function mbLoad(src) { return new Promise((res, rej) => { if ([...document.scripts].some(s => s.src === src)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('تعذّر تحميل أداة PDF. تأكدي من الإنترنت.')); document.head.append(s); }); }
async function mbPdf(pages, name) {
  await mbLoad('https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js');
  await mbLoad('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js');
  const pdf = await PDFLib.PDFDocument.create();
  for (const p of pages) {
    const url = await htmlToImage.toJpeg(p, { quality: .92, pixelRatio: 2, backgroundColor: '#fff' });
    const img = await pdf.embedJpg(await (await fetch(url)).arrayBuffer());
    const pg = pdf.addPage([595.28, 841.89]); const k = Math.min(595.28 / img.width, 841.89 / img.height);
    pg.drawImage(img, { x: (595.28 - img.width * k) / 2, y: 841.89 - img.height * k, width: img.width * k, height: img.height * k });
  }
  await saveFile(name + '.pdf', new Blob([await pdf.save()], { type: 'application/pdf' }));
}
async function mbOpen(html) {
  if (!document.getElementById('mbcss')) { const st = document.createElement('style'); st.id = 'mbcss'; st.textContent = MB_CSS; document.head.append(st); }
  document.getElementById('mbin')?.remove();
  const bg = document.createElement('div'); bg.className = 'rep-bg'; bg.id = 'mbin';
  bg.innerHTML = `<div class="rep-bar"><button class="btn" data-mb="print">طباعة</button><button class="btn" data-mb="pdf">تنزيل PDF</button><button class="btn" data-mb="close">إغلاق</button></div><div class="rep-pages">${html}</div>`;
  document.body.append(bg);
  const pgs = [...bg.querySelectorAll('.a4')];
  pgs.forEach((p, i) => { if (p.classList.contains('cover')) return; const f = document.createElement('div'); f.className = 'pfoot'; f.innerHTML = `<span>${esc(settings().school || '')} · التوجيه الطلابي</span><span>صفحة ${mbAr(i + 1)} من ${mbAr(pgs.length)}</span>`; p.append(f); });
  await mbFit(bg); mbZoom(bg);
  const onR = () => { if (!bg.isConnected) return removeEventListener('resize', onR); mbZoom(bg); }; addEventListener('resize', onR);
  bg.addEventListener('click', async e => {
    const b = e.target.closest('[data-mb]'); if (!b) return;
    if (b.dataset.mb === 'close') bg.remove();
    else if (b.dataset.mb === 'print') window.print();
    else { b.disabled = true; b.textContent = 'جارٍ التجهيز…'; const w = bg.querySelector('.rep-pages'); w.style.zoom = 1; try { await mbPdf([...bg.querySelectorAll('.a4')], 'ملف-الإحالات-والحالات'); } catch (er) { toast(er.message || 'تعذّر التجهيز'); } mbZoom(bg); b.disabled = false; b.textContent = 'تنزيل PDF'; }
  });
}

   رسالة واتساب لولي أمر طالبة الحالة (بدون أي تفاصيل سرية)
   ═══════════════════════════════════════════════════════════ */
const MWA_T = [
  { k: 'meet', t: 'طلب حضور لقاء', body: 'نأمل التكرم بالحضور إلى المدرسة يوم ........ الساعة ........ للقاء الموجهة الطلابية بخصوص متابعة ابنتكم.' },
  { k: 'check', t: 'اطمئنان ومتابعة', body: 'نطمئن على ابنتكم، ونود التواصل معكم لمتابعة أحوالها. نأمل الاتصال بالموجهة الطلابية في الوقت المناسب لكم.' },
  { k: 'thx', t: 'شكر على التعاون', body: 'نشكر لكم تعاونكم واهتمامكم بمتابعة ابنتكم، ويسعدنا ما لمسناه من تحسن. بارك الله فيكم وفيها.' },
  { k: 'free', t: 'رسالة خاصة', body: '' }];
const mwaNorm = s => String(s || '').replace(/\([^)]*\)/g, '').replace(/^مثال:\s*/, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[ً-ْ]/g, '').replace(/\s+/g, ' ').trim();
function mwaNum(p) { let d = toLat(String(p || '')).replace(/[^\d+]/g, '').replace(/^\+/, '').replace(/^00/, ''); if (/^05\d{8}$/.test(d)) d = '966' + d.slice(1); else if (/^5\d{8}$/.test(d)) d = '966' + d; return /^\d{10,15}$/.test(d) ? d : ''; }
function mwaHijri() { try { const p = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'numeric', year: 'numeric' }).formatToParts(new Date()); const g = t => parseInt((p.find(x => x.type === t) || {}).value, 10); return g('year') + '-' + String(g('month')).padStart(2, '0') + '-' + String(g('day')).padStart(2, '0'); } catch (e) { return todayISO(); } }
async function mwaStudents() {
  if (M.stuList) return M.stuList;
  let rows = [];
  try {
    if (Masar.demo) { const d = JSON.parse(localStorage.getItem('platform.demo.v8') || 'null'); rows = d ? Object.entries(d.docs || {}).filter(([, v]) => v.kind === 'student').map(([id, v]) => ({ id, ...v.data })) : []; }
    else rows = (await sbq(M.sb.from('platform_docs').select('id,data').eq('kind', 'student'))).map(r => ({ id: r.id, ...r.data }));
  } catch (e) { rows = []; }
  return (M.stuList = rows);
}
function mwaFind(list, c) {
  const n = mwaNorm(c.name); if (!n) return null;
  let hit = list.filter(s => mwaNorm(s.name) === n); if (hit.length === 1) return hit[0];
  const t = n.split(' ').slice(0, 2).join(' '); hit = list.filter(s => mwaNorm(s.name).startsWith(t) && (!c.grade || s.grade === c.grade)); return hit.length === 1 ? hit[0] : null;
}
async function mwaSaveContact(stu, c, tpl) {
  const id = 'contact-' + uid();
  const data = { studentId: stu ? stu.id : '', studentName: stu ? stu.name : String(c.name || '').replace(/^مثال:\s*/, ''), grade: c.grade || '', section: c.section || '', guardian: (stu && stu.guardian) || 'ولي الأمر', type: 'رسالة', date: mwaHijri(), reason: 'متابعة حالة', summary: 'رسالة واتساب من مسار: ' + tpl.t, outcome: '', follow: '' };
  try {
    if (Masar.demo) { const d = JSON.parse(localStorage.getItem('platform.demo.v8') || 'null'); if (d) { d.docs[id] = { kind: 'contact', data }; localStorage.setItem('platform.demo.v8', JSON.stringify(d)); } }
    else await sbq(M.sb.from('platform_docs').upsert({ id, kind: 'contact', data, updated_at: new Date().toISOString() }));
  } catch (e) {}
}

   <div class="sheetbody" style="display:grid;gap:12px"><style>[data-mwat][aria-pressed="true"]{background:#1F8A4C;border-color:#1F8A4C;color:#fff}</style>
     <div class="row" style="gap:6px;flex-wrap:wrap">${MWA_T.map(t => `<button type="button" class="btn sm" data-mwat="${t.k}" aria-pressed="${t.k === W.k}">${t.t}</button>`).join('')}</div>
     <label class="field"><span>نص الرسالة</span><textarea class="inp" id="mwa-body" style="min-height:150px">${esc(bodyOf(W.k))}</textarea></label>
     <label class="field"><span>جوال ولي الأمر</span><input class="inp" id="mwa-ph" inputmode="tel" dir="ltr" placeholder="05xxxxxxxx" value="${esc((stu && stu.phone) || '')}"></label>
     ${stu ? '' : '<p class="small muted">ما لقيت الطالبة في قائمة الطالبات، اكتبي الرقم يدوياً.</p>'}
     <label class="row" style="flex-wrap:nowrap"><input type="checkbox" id="mwa-log" checked><span>تسجيلها في الجلسات والمتابعة لهذه الحالة</span></label>
     <div class="row"><a class="btn primary" id="mwa-go" target="_blank" rel="noopener" style="background:#1F8A4C;border-color:#1F8A4C;text-decoration:none">إرسال واتساب</a><button class="btn" data-mwa="close">إلغاء</button></div>
     <p class="small muted">تُحفظ الرسالة أيضاً في «سجل التواصل مع أولياء الأمور» في قسم علاقة الأسرة بالمدرسة.</p>
   </div></div></div>`;
  const L = $('#layer2'); const go = L.querySelector('#mwa-go');

    const x = e.target.closest('[data-mwa]'); if (x && (x.dataset.mwa === 'close' || e.target === x)) { L.innerHTML = ''; return; }

      setTimeout(() => { L.innerHTML = ''; S.lastRendered = null; renderCase(); toast('سُجّلت الرسالة'); }, 400);

}
