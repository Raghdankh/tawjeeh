<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>منصة التوجيه الطلابي · مكتب الموجهة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&family=Amiri:wght@400;700&display=swap">
<script src="config.js"></script>
<script src="masar.js"></script>
<script src="ai.js"></script>
<style>
/* Layout: same desk as the platform home — teal band with section tabs, then each section as a list of record cards. Records open in a bottom sheet; reports render as A4 sheets in the ministry style. */
:root{
  color-scheme:light;
  --bg:#F1F4F3; --surface:#FFFFFF; --sunk:#E8EDEB; --ink:#18211F; --muted:#56635F; --line:#D8E0DD;
  --brand:#1F5E58; --brand-2:#2B7A72; --brand-ink:#FFFFFF; --brand-soft:#DDEEEB; --focus:#2F6BD1;
  --stu:#1F6FB2; --stu-soft:#E1EEFA;
  --fam:#C2416B; --fam-soft:#FBE4EC;
  --abs:#C9532A; --abs-soft:#FCE9E1;
  --hon:#B07A12; --hon-soft:#FBF0D6;
  --day:#6A4BC4; --day-soft:#ECE6FB;
  --prg:#0A8197; --prg-soft:#DDF2F5;
  --fil:#0E7F7B; --fil-soft:#DCF1EF;
  --val:#2E7D4F; --val-soft:#DFF2E6;
  --z1:#1F6FC4; --z1s:#DCEBFF; --z2:#C77700; --z2s:#FFF0C7; --z3:#B8263A; --z3s:#FDE0E4;
  --good:#2E7D4F; --good-soft:#DFF2E6; --bad:#B3363B; --bad-soft:#FBE3E4;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#111615; --surface:#19201F; --sunk:#141A19; --ink:#E6EDEB; --muted:#9FAEAA; --line:#2A3432;
  --brand:#174843; --brand-2:#8FCBBF; --brand-ink:#F2FAF8; --brand-soft:#1C302D; --focus:#7FA8F0;
  --stu:#7DB6EC; --stu-soft:#162B3E; --fam:#EE7FA2; --fam-soft:#3A1C27; --abs:#F08E66; --abs-soft:#3A2219; --hon:#E7B85A; --hon-soft:#3A2F15; --day:#B7A3F5; --day-soft:#251D3D; --prg:#5CC8DB; --prg-soft:#13303A; --fil:#5FC9C1; --fil-soft:#123432; --val:#74C994; --val-soft:#173323;
  --z1:#7CB6FF; --z1s:#172C45; --z2:#FFCB57; --z2s:#3A2F12; --z3:#FF7A8C; --z3s:#3F1A21;
  --good:#74C994; --good-soft:#173323; --bad:#EE7C80; --bad-soft:#3E1D20;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111615; --surface:#19201F; --sunk:#141A19; --ink:#E6EDEB; --muted:#9FAEAA; --line:#2A3432;
  --brand:#174843; --brand-2:#8FCBBF; --brand-ink:#F2FAF8; --brand-soft:#1C302D; --focus:#7FA8F0;
  --stu:#7DB6EC; --stu-soft:#162B3E; --fam:#EE7FA2; --fam-soft:#3A1C27; --abs:#F08E66; --abs-soft:#3A2219; --hon:#E7B85A; --hon-soft:#3A2F15; --day:#B7A3F5; --day-soft:#251D3D; --prg:#5CC8DB; --prg-soft:#13303A; --fil:#5FC9C1; --fil-soft:#123432; --val:#74C994; --val-soft:#173323;
  --z1:#7CB6FF; --z1s:#172C45; --z2:#FFCB57; --z2s:#3A2F12; --z3:#FF7A8C; --z3s:#3F1A21;
  --good:#74C994; --good-soft:#173323; --bad:#EE7C80; --bad-soft:#3E1D20;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.88rem} .tiny{font-size:.78rem}

/* band + tabs */
.band{background:var(--brand);color:var(--brand-ink)}
.band .wrap{padding-block:14px 0;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seal{width:42px;height:42px;border-radius:12px;background:var(--brand-ink);color:var(--brand);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.25rem;flex:none;text-decoration:none}
.bar .t b{display:block;font-family:var(--f-display);font-size:1.1rem}
.bar .t small{opacity:.85;font-size:.83rem}
.bar .end{margin-inline-start:auto;display:flex;gap:8px}
.ghostbtn{border:1.5px solid color-mix(in srgb,var(--brand-ink) 35%,transparent);background:transparent;color:var(--brand-ink);border-radius:10px;padding:6px 14px;font-weight:600;font-size:.9rem;min-height:40px;text-decoration:none;display:inline-flex;align-items:center}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{color:color-mix(in srgb,var(--brand-ink) 82%,transparent);text-decoration:none;font-weight:600;padding:10px 16px;border-radius:12px 12px 0 0;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--bg);color:var(--ink)}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
.band{background:radial-gradient(60% 140% at 100% 0%,rgba(255,255,255,.13),transparent 60%),linear-gradient(115deg,color-mix(in srgb,var(--brand) 85%,#000) 0%,var(--brand) 50%,color-mix(in srgb,var(--brand) 70%,#3FB39F) 100%)}
.band .wrap{padding-block:16px 40px}
.bar .t{padding-inline-start:12px;border-inline-start:4px solid #F2C46B}.bar .t b{font-size:1.25rem}
.secnav{margin-top:-30px;position:relative;z-index:2}
.secrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:6px 2px 10px;scroll-snap-type:x proximity}.secrow::-webkit-scrollbar{display:none}
.secrow a{flex:1 0 auto;min-width:104px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 12px 9px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600;font-size:.86rem;white-space:nowrap;box-shadow:0 6px 16px rgba(10,30,28,.08);transition:transform .15s,box-shadow .15s,background .15s}
.secrow a:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(10,30,28,.12)}
.secrow .si{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--ss);color:var(--sc)}.secrow .si svg{width:22px;height:22px}
.secrow a[aria-current="page"]{background:var(--sc);border-color:var(--sc);color:#fff;box-shadow:0 10px 22px color-mix(in srgb,var(--sc) 35%,transparent)}
.secrow a[aria-current="page"] .si{background:rgba(255,255,255,.22);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .secrow a[aria-current="page"]{color:#111}:root:not([data-theme="light"]) .secrow a[aria-current="page"] .si{color:#111;background:rgba(0,0,0,.12)}}
:root[data-theme="dark"] .secrow a[aria-current="page"]{color:#111}
main{padding-top:12px!important}


/* common */
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h1{font-size:clamp(1.35rem,4vw,1.7rem);display:flex;align-items:center;gap:10px}
.head h1 .dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 5px var(--cs)}
.head .sp{flex:1}
.lede{color:var(--muted);max-width:70ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:7px 14px;font-weight:600;font-size:.92rem;min-height:42px;white-space:nowrap;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--brand-2)}
.btn.primary{background:var(--c,var(--brand));border-color:var(--c,var(--brand));color:#fff}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:34px;padding:4px 11px;font-size:.84rem;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:600;font-size:.9rem;white-space:nowrap;display:flex;gap:6px;align-items:center}
.subtabs button[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.subtabs .n{font-size:.75rem;background:color-mix(in srgb,currentColor 16%,transparent);border-radius:999px;padding:0 7px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;min-height:44px}
.search input{border:0;background:transparent;flex:1;min-width:0;outline:none;padding:8px 0}
.search:focus-within{border-color:var(--c,var(--brand-2))}
select.sel{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;min-height:44px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0;border-inline-start:4px solid var(--c)}
.rec .t{display:flex;gap:10px;align-items:flex-start}
.rec .t b{font-family:var(--f-display);font-size:1.02rem;flex:1;min-width:0;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--sunk);border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.c{background:var(--cs);color:var(--c)}
.rec p.sum{font-size:.9rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:30px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column}
.tile b{font-family:var(--f-display);font-size:1.7rem;line-height:1.1;color:var(--tc,var(--ink))}
.tile span{color:var(--muted);font-size:.84rem;font-weight:600}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 11px;font-size:.8rem;font-weight:700;white-space:nowrap;background:var(--ps);color:var(--pc)}
.status{font-size:.9rem;color:var(--muted)}

/* students */
.grade{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.grade>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;font-family:var(--f-display);font-weight:600}
.grade>summary::-webkit-details-marker{display:none}
.grade>summary .n{margin-inline-start:auto;color:var(--muted);font-family:var(--f-body);font-size:.85rem}
.srows{border-top:1px solid var(--line)}
.srow{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow b{font-weight:600;flex:1;min-width:0}
.srow .sec{color:var(--muted);font-size:.82rem}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,18,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:760px){.sheet-bg{align-items:center;padding:20px}}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:760px){.sheet{border-radius:18px}}
.sheet .sh{display:flex;align-items:center;gap:10px}
.sheet .sh h2{flex:1;font-size:1.2rem}
.x{border:0;background:var(--sunk);border-radius:10px;width:40px;height:40px;font-size:1.1rem;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-weight:600;font-size:.86rem;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 12px;min-height:44px}
.f textarea{min-height:84px;resize:vertical;line-height:1.6}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--c,var(--brand-2));box-shadow:0 0 0 4px var(--cs,var(--brand-soft))}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:92px;height:92px;border-radius:10px;overflow:hidden;background:var(--sunk)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;inset-inline-end:4px;border:0;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;width:26px;height:26px;font-size:.8rem}
.addph{width:92px;height:92px;border-radius:10px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:.8rem;text-align:center;cursor:pointer;background:var(--surface)}
.addph input{display:none}
.ctrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.ctr{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.88rem;color:var(--muted)}
.ctr>div{display:flex;align-items:center;gap:6px}
.ctr input{flex:1;min-width:0;text-align:center;font-family:var(--f-display);font-size:1.6rem;font-weight:700;color:var(--cc);border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:54px}
.cbtn{width:54px;height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:1.5rem;font-weight:700;color:var(--cc);flex:none}
.cbtn:active{background:var(--sunk)}
.hd{display:flex;gap:6px}
.seg{display:flex;gap:6px;background:var(--sunk);padding:4px;border-radius:12px}
.seg label{flex:1}.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:10px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg input:checked+span{background:var(--surface);color:var(--c);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg input:focus-visible+span{outline:2px solid var(--c)}
.sheet:has(#m_c:checked) .onlyo,.sheet:has(#m_o:checked) .onlyc{display:none}
.log .tag{font-style:normal;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--fam-soft);color:var(--fam);flex:none}
.log .tag.in{background:var(--abs-soft);color:var(--abs)}
.clog{display:flex;flex-direction:column;gap:10px}
.sug{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1;margin-top:-4px}.sug>span{flex-basis:100%}
.sug button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.84rem;text-align:start;color:inherit}
.sug button[aria-pressed=true]{background:color-mix(in srgb,var(--prg) 14%,var(--surface));border-color:var(--prg);color:var(--prg);font-weight:700}
.sug button[aria-pressed=true]::before{content:'✓ '}
.picon{width:64px;height:64px;border-radius:20px;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:color-mix(in srgb,var(--c) 60%,#1b2422);display:grid;place-items:center;font-size:1.9rem;font-family:var(--f-display);font-weight:800;flex:none}
.myprg{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:16px;border:1.5px dashed var(--prg);background:color-mix(in srgb,var(--prg) 7%,var(--surface))}
.myprg>div{flex:1;min-width:220px;display:flex;flex-direction:column;gap:3px}.myprg span{font-size:.9rem;font-weight:600}.myprg small{color:var(--muted)}
.pcard{--ct:color-mix(in srgb,var(--c) 82%,#101816);position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,22,.04),0 4px 14px -6px rgba(16,24,22,.10);transition:box-shadow .2s,transform .2s,border-color .2s}
.pcard::before{content:'';position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--c)}
.pcard:hover{box-shadow:0 2px 4px rgba(16,24,22,.05),0 12px 28px -10px color-mix(in srgb,var(--c) 45%,transparent);transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.pc-main{display:flex;flex-direction:column;gap:8px;padding:16px 20px 14px;color:inherit;text-decoration:none;flex:1}
.pc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pc-dom{font-size:.76rem;font-weight:800;letter-spacing:.2px;color:var(--ct);display:inline-flex;align-items:center;gap:6px}
.pc-dom::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.pc-t{font-family:var(--f-display);font-size:1.12rem;font-weight:800;line-height:1.45;color:var(--ink,#16201e);margin:0}
.pc-sub{margin:0;font-size:.84rem;color:var(--muted);font-weight:600}.pc-sub i{font-style:normal;margin-inline:7px;opacity:.5}
.pc-tg{margin:0;font-size:.82rem;color:var(--muted)}
.pc-prog{display:flex;align-items:center;gap:10px;margin-top:4px}.pc-prog span{font-size:.76rem;color:var(--muted);font-weight:600;white-space:nowrap}
.pc-bar{flex:1;height:5px;border-radius:9px;background:color-mix(in srgb,var(--c) 12%,var(--sunk));overflow:hidden}.pc-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 70%,#fff))}
.pc-miss{margin:0;font-size:.8rem;font-weight:700;color:#A0620A;display:flex;align-items:center;gap:7px}.pc-miss::before{content:'';width:7px;height:7px;border-radius:50%;background:#D98B1A}
.pc-acts{display:flex;align-items:center;gap:6px;padding:10px 14px 12px 20px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--c) 3%,var(--surface))}
.pc-btn{border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));background:var(--surface);color:var(--ct);border-radius:9px;padding:6px 12px;font-size:.8rem;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s}
.pc-btn:hover{background:color-mix(in srgb,var(--c) 9%,var(--surface));border-color:var(--c)}
.pc-open{margin-inline-start:auto;font-size:.82rem;font-weight:800;color:var(--ct);text-decoration:none;padding:6px 4px;display:inline-flex;align-items:center;gap:6px}.pc-open::after{content:'←';font-weight:700;transition:transform .15s}.pcard:hover .pc-open::after{transform:translateX(-3px)}
.prg-head{border-inline-start:4px solid var(--c);background:var(--surface)}
.prg-head h1{color:var(--ink,#16201e)!important}
.prg-head .chip.c{color:color-mix(in srgb,var(--c) 82%,#101816)}
.prg-head .btn.primary{background:color-mix(in srgb,var(--c) 88%,#101816);border-color:transparent}
.panel.prep .rep-btn b{color:color-mix(in srgb,var(--c) 82%,#101816)}
.myprg{border-style:solid!important}

function ideasFor(p) {
  const txt = norm([p.title, p.goals, (p.steps || []).map(x => x.t).join(' ')].join(' ')), dom = norm(p.domain || '');
  const score = it => it.k.reduce((s, k) => s + (k === '*' ? 0.1 : txt.includes(norm(k)) ? 3 : dom.includes(norm(k)) ? 1 : 0), 0);
  const all = myIdeas().map(it => ({ ...it, i: 'm:' + it.id, s: score(it) + 0.5 })).concat(IDEAS.map((it, i) => ({ ...it, i, s: score(it) })));
  const strong = all.filter(x => x.s >= 3).sort((a, b) => b.s - a.s || a.i - b.i).slice(0, 4), gen = all.filter(x => x.k.includes('*') && !strong.includes(x)), weak = all.filter(x => x.s >= 1 && x.s < 3 && !strong.includes(x) && !gen.includes(x));
  return strong.concat(gen, weak);
}

const sgVals = (el, m) => m === 'lines' ? el.value.split('\n').map(x => x.trim()).filter(Boolean) : m === 'list' ? el.value.split(/[،,]/).map(x => x.trim()).filter(Boolean) : [el.value.trim()];
function addSug(root) {
  Object.entries(SUG).forEach(([id, cfg]) => {
    const el = root.querySelector('#' + id); if (!el || el.dataset.sgOn) return; el.dataset.sgOn = 1;
    const box = document.createElement('div'); box.className = 'presets sgrow'; box.dataset.sgfor = id;
    const cur = sgVals(el, cfg.m); const opts = typeof cfg.o === 'function' ? cfg.o(root) : cfg.o;
    box.innerHTML = opts.map(t => `<button type="button" data-sg="${esc(t)}" aria-pressed="${cur.includes(t)}">${esc(t)}</button>`).join('');
    const host = el.closest('label,.f,.field') || el; host.after(box);
  });
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-sg]'); if (!b) return; const box = b.closest('[data-sgfor]'); if (!box) return; e.preventDefault();
  const id = box.dataset.sgfor; const cfg = SUG[id]; const el = document.getElementById(id); if (!el || !cfg) return; const t = b.dataset.sg;
  if (cfg.m === 'set') { el.value = t; box.querySelectorAll('[data-sg]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }
  else { let L = sgVals(el, cfg.m); L = L.includes(t) ? L.filter(x => x !== t) : L.concat(t); el.value = L.join(cfg.m === 'lines' ? '\n' : '، '); b.setAttribute('aria-pressed', String(L.includes(t))); }
  el.dispatchEvent(new Event('input', { bubbles: true }));
}, true);
new MutationObserver(() => { const s = document.getElementById('sheetbg'); if (s) addSug(s); }).observe(document.body, { childList: true });

/* ═════════ شهادات لوحة الشرف (انضباط وتميّز) → ملف التكريم ═════════ */
async function syncIndibat() {
  if (DB.demo || S.ibSync) return; S.ibSync = true;
  let rows; try { rows = await q(DB.sb.from('indibat_honors').select('id,hy,hm,list,name,cls')); } catch (e) { return; }
  const want = {}; rows.forEach(r => { want['honor-ib-' + r.id] = r; });
  const add = [];
  Object.entries(want).forEach(([id, r]) => {
    if (DB.docs[id]) return; const ex = r.list === 'excellent'; const parts = String(r.cls || '').trim().split(/\s+/); const g = GRADES.includes(parts[0]) ? parts[0] : '';
    add.push({ id, kind: 'honor', data: { src: 'indibat', type: 'student', theme: ex ? 'gold' : 'green', name: r.name, grade: g, section: g ? parts.slice(1).join(' ') : '', label: '',
      title: 'شهادة شكر وتقدير', occasion: 'لوحة الشرف — ' + HM[r.hm] + ' ' + ar(r.hy) + 'هـ', reason: ex ? 'لتميّزها السلوكي وأخلاقها الرفيعة' : 'لانضباطها ومواظبتها على الحضور',
      bless: ex ? 'بارك الله فيكِ، وزادكِ خُلقًا وعلمًا وتميّزًا' : 'سائلين الله لها دوام التوفيق والنجاح', date: r.hy + '-' + pad2(r.hm + 1) + '-29', sealText: ex ? 'تميّز سلوكي' : 'انضباط', studentId: '' } });
  });
  const gone = list('honor').filter(h => h.src === 'indibat' && !want[h.id]);
  try { if (add.length) await saveMany(add); for (const h of gone) await delDoc(h.id); } catch (e) { return; }
  if ((add.length || gone.length) && ['honors', 'files'].includes(S.route)) rerender();
}

      if (S.bsave !== false) await saveMany(recs.map(r => ({ id: uid('hon'), kind: 'honor', data: r })));
      msg.textContent = `تم إصدار ${ar(recs.length)} شهادة${S.bsave !== false ? ' وحفظها في ملف التكريم' : ''}.`; S.lastBatch = recs; if (recs.some(r => r.type === 'student')) msg.insertAdjacentHTML('beforeend', ' <button type="button" class="btn sm wa" data-act="honBatchWA">📲 تهنئة أولياء أمورهن</button>');
    } catch (er) { msg.textContent = errT(er); }
    b.disabled = false;
  }
  else if (act === 'honRep') openReport(honLogReport(), 'سجل-التكريم');
});

/* ═════════ boot ═════════ */
(async function boot() {
  const app = $('#app');
  try {
    DB.sb = window.Masar ? await Masar.client() : null;
    if (!DB.sb) { app.innerHTML = '<div class="wrap" style="padding:40px 16px"><div class="empty"><b>المنصة لم تُربط بقاعدة البيانات بعد</b><a class="btn" href="index.html">الصفحة الرئيسية</a></div></div>'; return; }
    DB.demo = !!DB.sb.demo;
    try { const info = await q(DB.sb.rpc('masar_info')); if (info && info.school) S.school = info.school; } catch (e) {}
    if (!DB.demo) {
      const ses = (await DB.sb.auth.getSession()).data.session; let admin = false;
      if (ses) { try { admin = (await q(DB.sb.from('masar_admins').select('user_id').limit(1))).length > 0; } catch (e) {} }
      if (!admin) { location.replace('index.html#login'); return; }
    }
    await loadAll();
  } catch (e) { app.innerHTML = `<div class="wrap" style="padding:40px 16px"><div class="empty"><b>تعذّر التحميل</b><span>${esc(errT(e))}</span><button class="btn" onclick="location.reload()">إعادة المحاولة</button></div></div>`; return; }
  route();
  if (S.route === 'honors') schedulePreview();
})();
</script>
